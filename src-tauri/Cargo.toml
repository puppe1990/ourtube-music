[package]
name = "ourtube-music"
version = "0.2.0"
description = "OurTube Music — leitor dos endpoints internos do YouTube Music (Innertube WEB_REMIX/IOS)"
edition = "2021"

[lib]
name = "ourtube_music"
path = "src/lib.rs"

[[bin]]
name = "ourtube-music"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha1 = "0.10"
md-5 = "0.10"

[dev-dependencies]
fake = "2"
