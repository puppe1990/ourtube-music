name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ''
          - name: Linux
            platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: System deps for Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend dist
        run: node scripts/make-tauri-dist.mjs

      - name: Bundle and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OurTube Music ${{ github.ref_name }}
          releaseBody: |
            Desktop reader for YouTube Music (Tauri 2).

            - macOS: `.dmg` (Apple Silicon). Unsigned — right-click the app → Open the first time.
            - Windows: `.msi` / `.exe` (NSIS).
            - Linux: `.deb` and AppImage (Ubuntu 22.04 glibc).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
